[project]
name = "Nepali-Diet-Advisory-System"
version = "0.1.0"
description = "An AI-powered personalized diet and fitness advisory system for Nepali cuisine. The system analyzes food images or user-provided meal information to identify local dishes, estimate nutritional values, and generate personalized dietary recommendations based on individual health profiles, fitness goals, and dietary preferences."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.6",
    "django-admin>=2.0.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "python-multipart>=0.0.32",
    "seaborn>=0.13.2",
    "ultralytics>=8.4.121",
]
